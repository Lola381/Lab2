<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
  <rect width="1200" height="560" fill="#0f172a"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Arial, sans-serif" font-size="32" font-weight="700">GitHub Actions CI Pipeline</text>
  <text x="70" y="104" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Triggered by every push and pull request</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="190" width="210" height="130" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
    <text x="175" y="235" text-anchor="middle" fill="#7dd3fc" font-size="18" font-weight="700">TRIGGER</text>
    <text x="175" y="270" text-anchor="middle" fill="#f8fafc" font-size="20">Push / PR</text>
    <text x="175" y="296" text-anchor="middle" fill="#94a3b8" font-size="15">GitHub repository</text>
    <path d="M280 255 H350" stroke="#38bdf8" stroke-width="4"/><path d="M350 255 l-15 -10 v20 z" fill="#38bdf8"/>
    <rect x="370" y="150" width="250" height="210" rx="14" fill="#1e293b" stroke="#22c55e" stroke-width="3"/>
    <text x="495" y="195" text-anchor="middle" fill="#86efac" font-size="18" font-weight="700">VALIDATE</text>
    <text x="495" y="235" text-anchor="middle" fill="#f8fafc" font-size="18">Ubuntu runner</text>
    <text x="495" y="272" text-anchor="middle" fill="#cbd5e1" font-size="16">Node.js 20</text>
    <text x="495" y="302" text-anchor="middle" fill="#cbd5e1" font-size="16">npm ci</text>
    <text x="495" y="332" text-anchor="middle" fill="#cbd5e1" font-size="16">Syntax check</text>
    <path d="M620 255 H690" stroke="#22c55e" stroke-width="4"/><path d="M690 255 l-15 -10 v20 z" fill="#22c55e"/>
    <rect x="710" y="150" width="250" height="210" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
    <text x="835" y="195" text-anchor="middle" fill="#fcd34d" font-size="18" font-weight="700">FRONTEND GATES</text>
    <text x="835" y="242" text-anchor="middle" fill="#f8fafc" font-size="18">ESLint</text>
    <text x="835" y="282" text-anchor="middle" fill="#f8fafc" font-size="18">Vite build</text>
    <text x="835" y="330" text-anchor="middle" fill="#94a3b8" font-size="15">Pass / fail feedback</text>
    <path d="M835 360 V420" stroke="#f59e0b" stroke-width="4"/><path d="M835 420 l-10 -15 h20 z" fill="#f59e0b"/>
    <rect x="700" y="435" width="270" height="68" rx="12" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="835" y="478" text-anchor="middle" fill="#bbf7d0" font-size="20" font-weight="700">Successful CI run</text>
  </g>
</svg>
